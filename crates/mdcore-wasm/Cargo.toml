[package]
name = "mdcore-wasm"
version.workspace = true
edition = "2021"
description = "Headless Core v0 的 WASM 绑定（WebView 内 CM6 View 的对端）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mdcore = { path = "../mdcore" }
# t16：首个 office 消费边（REUSE.md §0「经 wasm 桥」路径；三域纪律——
# 仅消费方依赖，office-io 不依赖 mdcore）。零三方闭包增量：office-io
# 及其全部依赖已在本 workspace Cargo.lock。
mdc-office-io = { path = "../office-io" }
serde_json.workspace = true
wasm-bindgen = "0.2"
