[package]
name = "mdc-pdf"
version.workspace = true
edition = "2021"
description = "第二 Document Model（PDF 面）：页/大纲/标注三层模型 + Command 边界 + 安全策略 + 宿主协议草案；与 mdcore 块核并列互不依赖，引擎（pdfium/lopdf）自 PDF-c 轮接入。"

# PDF-b 骨架轮依赖纪律：仅 serde 系（workspace 既有版本，零新增解析面）。
# pdfium（pdfium-render，non-V8 构建）/ lopdf 属引擎面，PDF-c/d 引入——
# 骨架轮不耦合原生库，workspace 在无 pdfium 二进制的环境保持全绿
# （决策记录见 gates.md PDF-b 节）。
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
