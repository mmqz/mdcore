<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>R9 — CM6 ↔ mdcore-wasm bridge</title>
<style>
  body { margin: 0; font: 15px/1.6 -apple-system, "Segoe UI", sans-serif; background: #fff; color: #222; }
  #editor { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .cm-editor { outline: none; }
  .cm-content { font: inherit; }
  .cm-line.cm-heading { font-weight: 700; }
  .cm-line.cm-h1 { font-size: 1.9em; }
  .cm-line.cm-h2 { font-size: 1.6em; }
  .cm-line.cm-h3 { font-size: 1.35em; }
  .cm-line.cm-list-line { padding-left: 8px; }
  .cm-line.cm-quote-line { border-left: 3px solid #cfd4dc; color: #556; padding-left: 8px; }
  .cm-list-marker { color: #b48eff; font-weight: 600; }
  .cm-quote-marker { color: #9aa3af; }
  .cm-fence { color: #9aa3af; background: #f7f8fa; }
  .cm-inline-code { background: #f4f4f5; border-radius: 4px; padding: 1px 4px; font: 0.92em ui-monospace, monospace; }
  .cm-bold { font-weight: 700; }
  .cm-marker-revealed { background: #fff3d6; }
  .cm-hr { border: none; border-top: 2px solid #ddd; margin: 12px 0; }
  #debug { max-width: 760px; margin: 8px auto 40px; padding: 8px 12px; font: 11px/1.5 ui-monospace, monospace;
           color: #667; background: #f7f8fa; border-radius: 6px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  /* t16/t17：导入工具条（最小面——文件入口 + 状态行；.import-btn = 两导入钮共享样式）
     t18/t19：export .docx / export .xlsx 同类面共享（动作钮无 file input） */
  #toolbar { max-width: 760px; margin: 14px auto 0; padding: 0 16px; font-size: 13px; }
  .import-btn { display: inline-block; padding: 3px 12px; border: 1px solid #cfd4dc; border-radius: 6px;
                color: #455; background: #f7f8fa; cursor: pointer; user-select: none; margin-right: 8px; }
  .import-btn:hover { background: #eef0f4; }
  button.import-btn { border: 0; font: inherit; }
  #docx-status, #xlsx-status { margin-left: 10px; color: #667; }
  #docx-status.docx-error, #xlsx-status.xlsx-error { color: #b00; }
  #docx-export-status { margin-left: 10px; color: #667; }
  #docx-export-status.docx-export-error { color: #b00; }
  #xlsx-export-status { margin-left: 10px; color: #667; }
  #xlsx-export-status.xlsx-export-error { color: #b00; }
</style>
</head>
<body>
<div id="toolbar">
  <label class="import-btn" for="docx-file">import .docx</label>
  <input type="file" id="docx-file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
  <span id="docx-status"></span>
  <label class="import-btn" for="xlsx-file">import .xlsx</label>
  <input type="file" id="xlsx-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
  <span id="xlsx-status"></span>
  <button type="button" class="import-btn" id="docx-export-btn">export .docx</button>
  <span id="docx-export-status"></span>
  <button type="button" class="import-btn" id="xlsx-export-btn">export .xlsx</button>
  <span id="xlsx-export-status"></span>
</div>
<div id="editor"></div>
<pre id="debug">booting…</pre>
<script type="module" src="./main.js"></script>
</body>
</html>
